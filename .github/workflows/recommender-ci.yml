name: Recommender CI

on:
  push:
    branches: [main]
    paths:
      - "projects/hybrid-product-recommender/**"
      - ".github/workflows/recommender-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/hybrid-product-recommender/**"
      - ".github/workflows/recommender-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommender-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/hybrid-product-recommender
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/hybrid-product-recommender/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic demo and write report
        run: python -m recommender --seed 42 --k 10 --output outputs/ci-report.json

      - name: Run alternate synthetic configuration
        run: python -m recommender --seed 17 --k 5
